name: ci

# CPU gate for the whole repository (D-026). The GPU and sidecar suites cannot
# run on GitHub-hosted runners: they need CUDA, the pinned weights under
# `models/`, and the M2ST sidecar. They stay on the dev box (`scripts/ci.sh --gpu`)
# or on the optional self-hosted runner described in docs/ci.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: cpu (lint, types, licenses, tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      MPLCONFIGDIR: ${{ github.workspace }}/.cache/mpl
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ffmpeg (S0 ingest tests)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      # Only the dependencies the CPU suite touches: the GPU stack (torch,
      # transkun, beat_this, demucs, music21, cairosvg) is deliberately absent,
      # which also proves the core imports stay lazy (NFR-01, D-026).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -e .
          python -m pip install \
            "pydantic>=2.6" "PyYAML>=6" "httpx>=0.27" "numpy>=1.26" \
            "soundfile>=0.12" "verovio>=4.3" "pretty_midi>=0.2.10" \
            "fastapi>=0.110" "sqlmodel>=0.0.21" "python-multipart>=0.0.9" \
            "pytest>=8" "pytest-timeout>=2.3" "ruff>=0.4" "pyright>=1.1"

      - name: Generate the licence-safe test fixture
        run: |
          mkdir -p data/fixtures/smoke
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "sine=frequency=440:duration=6:sample_rate=44100" \
            -ac 2 data/fixtures/smoke/fast_passage.wav
          ls -l data/fixtures/smoke/fast_passage.wav

      - name: ruff check
        run: python -m ruff check p2s tests scripts bench

      - name: ruff format --check
        run: python -m ruff format --check p2s tests scripts bench

      - name: pyright
        run: python -m pyright --pythonpath "$(command -v python)" p2s

      - name: license register
        run: python scripts/check_licenses.py

      - name: docs i18n (English + Vietnamese pairs, links)
        run: python scripts/check_docs.py

      - name: models.lock gate
        run: python scripts/check_lock.py

      - name: pytest (CPU, no GPU, no sidecars)
        run: python -m pytest -m "not gpu and not sidecar" -q --timeout=120 -p no:cacheprovider

  web:
    name: web (typecheck, build, unit tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 22 (pnpm via corepack)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@12.8.1 --activate

      - name: Install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build (tsc + vite)
        working-directory: apps/web
        run: pnpm build

      - name: Unit tests (vitest)
        working-directory: apps/web
        run: ./node_modules/.bin/vitest run
