[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "p2s"
version = "0.1.6"
description = "Piano audio/video to two-staff sheet music, fully local"
requires-python = ">=3.11,<3.12"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6",
  "httpx>=0.27",
  "numpy>=1.26",
  "music21>=9.1",
  "verovio>=4.3",
  "soundfile>=0.12",
  "cairosvg>=2.7",
  "pretty_midi>=0.2.10",
  "pypdf>=4",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "sqlmodel>=0.0.21"]
dev = ["pytest>=8", "pytest-timeout>=2.3", "ruff>=0.4", "pyright>=1.1"]

[project.scripts]
p2s = "p2s.cli:main"
p2s-bench = "p2s.bench_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["p2s"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI reads these defaults as dependency markers, not as mutable defaults.
"p2s/api/**" = ["B008"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["p2s"]
# The interpreter comes from --pythonpath (scripts/ci.sh, GitHub Actions) so the
# same config works with the local co-install venv and a clean CI environment.
exclude = ["**/node_modules", "**/.venv", "data", "spike", "sidecars"]
# torch, beat_this, moduleconf, pydub, soxr, fastapi and cairosvg are optional at
# import time (lazy engine/sidecar paths) and are absent from the light CI image.
# They surface as warnings, not errors, so a clean `pyright` still gates the code
# that the CPU environment can actually run.
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: needs a CUDA GPU",
  "sidecar: needs a running sidecar",
  "slow: long-running",
]
addopts = "-ra"
